<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chisel Industries Design Preview</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-ink: #111111;
            --color-canvas: #FFFFFF;
            --color-accent: #F2EFED;
            --color-attention: #3B8E9A;
            --color-subtle: #333333;
            --font-heading: 'Montserrat', sans-serif;
            --font-body: 'Inter', sans-serif;
        }

        body {
            background-color: var(--color-ink);
            color: var(--color-canvas);
            font-family: var(--font-body);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .hero {
            width: 100%;
            height: 60vh;
            background: linear-gradient(rgba(17, 17, 17, 0.5), rgba(17, 17, 17, 0.8)), url('https://images.unsplash.com/photo-1541888946425-d81bb19480c5?auto=format&fit=crop&q=80&w=1000') no-repeat center center/cover;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            border-bottom: 4px solid var(--color-attention);
        }

        h1 {
            font-family: var(--font-heading);
            font-size: 4rem;
            margin: 0;
            letter-spacing: -2px;
            text-transform: uppercase;
        }

        p {
            font-size: 1.2rem;
            max-width: 600px;
            color: var(--color-accent);
        }

        .btn-ghost {
            border: 2px solid var(--color-canvas);
            background: transparent;
            color: var(--color-canvas);
            padding: 12px 24px;
            font-family: var(--font-body);
            font-weight: 600;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
        }

        .btn-ghost:hover {
            background: var(--color-canvas);
            color: var(--color-ink);
        }

        .palette {
            display: flex;
            gap: 20px;
            margin-top: 40px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
        }

        .swatch {
            width: 100px;
            height: 100px;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 10px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .swatch.ink { background: var(--color-ink); border: 1px solid var(--color-subtle); }
        .swatch.canvas { background: var(--color-canvas); color: var(--color-ink); }
        .swatch.accent { background: var(--color-accent); color: var(--color-ink); }
        .swatch.attention { background: var(--color-attention); }
    </style>
</head>
<body>
    <div class="hero">
        <h1>CHISEL</h1>
        <p>Crafting the Future of Built World Services</p>
        <button class="btn-ghost">Learn More</button>
    </div>

    <div class="palette">
        <div class="swatch ink">Ink<br>#111111</div>
        <div class="swatch canvas">Canvas<br>#FFFFFF</div>
        <div class="swatch accent">Accent<br>#F2EFED</div>
        <div class="swatch attention">Attention<br>#3B8E9A</div>
    </div>
</body>
</html>
